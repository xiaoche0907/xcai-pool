name: xcaipool
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: framepool
      POSTGRES_PASSWORD: ${FRAMEPOOL_DB_PASSWORD:?Set FRAMEPOOL_DB_PASSWORD in infra/.env}
      POSTGRES_DB: framepool
    volumes:
      - xcaipool-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U framepool -d framepool"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 4310
      DATABASE_URL: postgres://framepool:${FRAMEPOOL_DB_PASSWORD}@postgres:5432/framepool
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Set ADMIN_API_KEY in infra/.env}
      ALLOW_SHORT_ADMIN_KEY: "1"
      VIEWER_API_KEY: ${VIEWER_API_KEY:?Set VIEWER_API_KEY in infra/.env}
      GENERATION_ENABLED: "false"
      LIBTV_BINARY: /repo/.local/libtv-linux-x64/libtv-linux-x64/libtv
      LIBTV_ACCOUNT_ROOT: /repo/.local/libtv-p0/accounts
    volumes:
      - ../.local:/repo/.local
    ports:
      - "127.0.0.1:4310:4310"
    command: >
      sh -c "node_modules/.bin/tsx packages/db/src/migrate.ts &&
             node_modules/.bin/tsx apps/api-server/src/main.ts"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4310/api/v1/config',{headers:{Authorization:'Bearer '+process.env.VIEWER_API_KEY}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  xcaipool-postgres:
