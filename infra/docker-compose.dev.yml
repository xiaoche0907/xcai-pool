name: framepool-p1
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: framepool
      POSTGRES_PASSWORD: ${FRAMEPOOL_DB_PASSWORD:?Set a new local database password}
      POSTGRES_DB: framepool
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - framepool-p1-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U framepool -d framepool"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  framepool-p1-postgres:
